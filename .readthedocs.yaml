# ref: https://mystmd.org/guide/deployment-readthedocs
version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.12"
    nodejs: "20"
  commands:
    - pip install mystmd
    - cd docs && myst build --html
    - mkdir -p $READTHEDOCS_OUTPUT/html/
    - cp -r docs/_build/html/. "$READTHEDOCS_OUTPUT/html"
    - rm -rf docs/_build
